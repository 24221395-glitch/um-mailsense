# Owner: Raihan. Runs on every pull request and on pushes to develop and main.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  python:
    name: Backend + AI (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ai/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend ai qa/api
      - name: Format check (black)
        run: black --check backend ai qa/api
      - name: AI tests
        run: pytest ai/tests -q
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: QA API tests
        run: pytest qa/api -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
