[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsense-ai"
version = "0.1.0"
description = "Email classification, detail extraction, CV parsing and recommendations for UM MailSense"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pypdf>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["mailsense_ai*"]

[tool.setuptools.package-data]
mailsense_ai = ["prompts/*.txt"]
