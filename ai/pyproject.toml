[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsense-ai"
version = "0.1.0"
description = "UM MailSense AI: email classification, detail extraction, CV parsing, recommendations"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.6",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["mailsense_ai*"]

[tool.setuptools.package-data]
mailsense_ai = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
