# Owner: Raihan. Local development services.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailsense
      POSTGRES_PASSWORD: mailsense
      POSTGRES_DB: mailsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailsense"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mailsense:mailsense@db:5432/mailsense
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
